<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>生成记录 · RH Studio</title>
<meta name="description" content="RH Studio generation history" />
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./history.css">
</head>
<body class="history-page-body">
<div class="ambient ambient-a"></div>
<div class="ambient ambient-b"></div>
<div class="noise"></div>

<div class="history-shell">
  <header class="history-topbar glass">
    <div class="history-title">
      <a class="history-logo" href="/">RH</a>
      <div>
        <span>GENERATION HISTORY</span>
        <strong>生成记录</strong>
      </div>
      <b id="historyCount">0</b>
    </div>

    <div class="history-actions">
      <button id="importHistoryTask" class="history-action-btn" type="button">导入 Task</button>
      <a class="history-back" href="/">返回工作台 <b>↙</b></a>
    </div>
  </header>

  <main class="history-main">
    <div id="historyList" class="history-masonry">
      <div class="history-empty">
        <strong>还没有生成记录</strong>
        <span>从工作台生成的视频会自动出现在这里。</span>
      </div>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="./history.js"></script>
</body>
</html>
