<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RH Studio</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">RH Studio</div>
    <div class="top-actions">
      <button class="nav-btn active" data-route="workspace">工作台</button>
      <button class="nav-btn" data-route="settings">设置</button>
    </div>
  </header>

  <main>
    <section id="workspacePage" class="page">
      <div class="controls">
        <div class="control-row">
          <input id="appId" class="input" placeholder="AI App ID" />
          <select id="instanceType" class="input compact">
            <option value="default">Default · 24G</option>
            <option value="plus">Plus · 48G</option>
            <option value="ultra">Ultra · 84G</option>
          </select>
          <select id="personalQueue" class="input compact">
            <option value="false">普通队列</option>
            <option value="true">个人队列</option>
          </select>
        </div>

        <div id="keyWarning" class="warning hidden">尚未配置 RunningHub API Key，请先前往设置。</div>

        <div class="nodes-head">
          <span>节点参数</span>
          <div>
            <button id="addParam" class="btn secondary">＋ 参数</button>
            <button id="addFile" class="btn secondary">＋ 文件</button>
          </div>
        </div>
        <div id="nodes" class="nodes"></div>

        <div class="run-row">
          <span id="nodeCount" class="muted">0 个有效节点</span>
          <button id="runBtn" class="btn primary">运行工作流</button>
        </div>
      </div>

      <div class="results-head">
        <div>
          <h1>结果</h1>
          <p>生成完成后自动显示在瀑布流中。</p>
        </div>
        <div id="taskStatus" class="status">等待任务</div>
      </div>

      <div id="resultArea" class="masonry">
        <div class="empty">暂无生成结果</div>
      </div>
    </section>

    <section id="settingsPage" class="page hidden">
      <div class="settings-wrap">
        <h1>设置</h1>
        <p class="muted">API Key 仅保存在当前浏览器。</p>

        <div class="setting-block">
          <label>RunningHub API Key</label>
          <div class="key-input-row">
            <input id="apiKeyInput" class="input" type="password" autocomplete="off" placeholder="输入 API Key" />
            <button id="toggleKey" class="btn secondary">显示</button>
          </div>
          <div id="keyStatusText" class="muted small">尚未保存</div>
          <div id="keyMask" class="muted small"></div>
        </div>

        <div class="settings-actions">
          <button id="saveKey" class="btn primary">保存 / 覆盖</button>
          <button id="clearKey" class="btn secondary danger">清除 API Key</button>
          <button id="clearLocal" class="btn secondary">清除本地工作台数据</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
